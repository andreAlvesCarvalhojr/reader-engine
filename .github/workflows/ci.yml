name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build demo
        run: cargo build -p reader-demo

      - name: Build FFI (host)
        run: cargo build -p reader-ffi

      - name: Generate Kotlin bindings
        run: |
          cargo run -p reader-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libreader_ffi.so \
            --language kotlin \
            --out-dir /tmp/reader-ffi-kt \
            --config crates/reader-ffi/uniffi.toml \
            --no-format

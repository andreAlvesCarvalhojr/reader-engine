name: Publish mobile libraries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 0.1.0) when not tagging"
        required: false
        default: "0.1.0-SNAPSHOT"

concurrency:
  group: publish-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  android-aar:
    name: Android AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.version || '0.1.0-SNAPSHOT' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-publish

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Build Rust for Android
        run: ./scripts/android-build-rust.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Checkout existing public Maven repo
        if: github.ref_type == 'tag'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: mvn-repo
          path: platforms/android/public-maven

      - name: Publish to public Maven layout
        working-directory: platforms/android
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p public-maven
          # Drop git metadata from the previous checkout so we republish a clean tree
          rm -rf public-maven/.git
          ./gradlew :reader-engine:publishReleasePublicationToPublicMavenRepository --no-daemon

      - name: Publish public Maven repo branch
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: platforms/android/public-maven
          publish_branch: mvn-repo
          keep_files: true
          force_orphan: false
          commit_message: "maven: publish reader-engine ${{ steps.ver.outputs.name }}"

      - name: Deploy public Maven host (Vercel)
        if: github.ref_type == 'tag'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "Skipping Vercel deploy (set secret VERCEL_TOKEN to enable)."
            exit 0
          fi
          ./scripts/deploy-public-maven-vercel.sh

      - name: Publish to GitHub Packages (optional)
        if: github.ref_type == 'tag'
        continue-on-error: true
        working-directory: platforms/android
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew :reader-engine:publishReleasePublicationToGitHubPackagesRepository --no-daemon

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-engine-aar
          path: platforms/android/reader-engine/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Upload public-maven layout
        uses: actions/upload-artifact@v4
        with:
          name: public-maven
          path: platforms/android/public-maven
          if-no-files-found: error

  ios-xcframework:
    name: iOS XCFramework
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-publish

      - name: Build XCFramework
        run: ./scripts/ios-build-xcframework.sh

      - name: Upload XCFramework zip
        uses: actions/upload-artifact@v4
        with:
          name: reader-ffi-xcframework
          path: platforms/ios/build/ReaderFfiFFI.xcframework.zip
          if-no-files-found: error

      - name: Write checksum
        run: |
          ZIP=platforms/ios/build/ReaderFfiFFI.xcframework.zip
          echo "$(swift package compute-checksum "$ZIP")" > platforms/ios/build/ReaderFfiFFI.xcframework.zip.checksum
          cat platforms/ios/build/ReaderFfiFFI.xcframework.zip.checksum

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: reader-ffi-xcframework-checksum
          path: platforms/ios/build/ReaderFfiFFI.xcframework.zip.checksum

  release-assets:
    name: Attach release assets
    needs: [android-aar, ios-xcframework]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/reader-engine-aar/*.aar
            dist/reader-ffi-xcframework/*.zip
            dist/reader-ffi-xcframework-checksum/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

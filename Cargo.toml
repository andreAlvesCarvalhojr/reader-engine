[workspace]
resolver = "2"
members = [
    "crates/reader-core",
    "crates/reader-epub",
    "crates/reader-hpub",
    "crates/reader-json",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
reader-core = { path = "crates/reader-core" }

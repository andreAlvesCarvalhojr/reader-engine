[package]
name = "reader-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Demo web do reader-engine (sessão + parsers)"

[[bin]]
name = "reader-demo"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.5", features = ["cors"] }
serde.workspace = true
serde_json.workspace = true
reader-core = { workspace = true, features = ["zip"] }
reader-epub.workspace = true
reader-hpub.workspace = true
reader-json.workspace = true
